# Cloudflare Pages 설정 (학급 현황판 API용 D1 연결)
name = "english-voca-note-app"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "english-cbt"  # 무료 플랜 D1 개수 한도로 기존 DB를 함께 씀 (테이블은 voca_ 접두사)
database_id = "9fc40049-21fd-4142-812b-5cc9a5a56bfb"
migrations_dir = "migrations"
migrations_table = "voca_migrations"  # english-cbt의 d1_migrations와 섞이지 않게

# 발음하기 서버 음성 인식용
[ai]
binding = "AI"
