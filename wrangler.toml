# Cloudflare Pages 설정 (학급 현황판 API용 D1 연결)
name = "english-voca-note-app"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "word-app-db"  # note.allforedu.kr·voca.allforedu.kr 단어 앱 공용 DB (이 앱 테이블은 voca_ 접두사)
database_id = "60ea4ccf-a76b-4438-b7ec-c96a20a6924d"
migrations_dir = "migrations"
migrations_table = "voca_migrations"  # 함께 쓰는 앱의 마이그레이션 기록과 섞이지 않게

# 발음하기 서버 음성 인식용
[ai]
binding = "AI"
